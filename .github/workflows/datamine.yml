name: datamine
on:
  schedule: [{ cron: "*/15 * * * *" }]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  mine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - name: Fetch pinned FFDec
        run: |
          mkdir ffdec && cd ffdec
          # pin an exact release, e.g. version 22.0.2 from the jindrapetrik/jpexs-decompiler releases page
          curl -L -o ffdec.zip "$FFDEC_URL" && unzip ffdec.zip
        env:
          FFDEC_URL: ${{ vars.FFDEC_URL }}
      - run: python datamine.py
      - name: Commit
        run: |
          git config user.name "datamine-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A client state.json
          VER=$(jq -r '.sVersion + " " + .sFile' client/gameversion.json)
          git diff --cached --quiet || (git commit -m "AQW client $VER" && git push)