name: datamine
on:
  schedule: [{ cron: "*/15 * * * *" }] 
  workflow_dispatch:
permissions: { contents: write }
jobs:
  mine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - name: Fetch pinned FFDec
        run: |
          mkdir ffdec && cd ffdec
          curl -L -o ffdec.zip "https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.3.0/ffdec_26.3.0.zip" && unzip ffdec.zip
        env:
          FFDEC_URL: ${{ vars.FFDEC_URL }}
      - run: python scripts/datamine.py
        env:
            MODULES: main,assets  
      - name: Report to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python scripts/diffreport.py --old prev --new client  
      - name: Commit
        run: |
          git config user.name "datamine-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A client state.json
          VER=$(jq -r '.sVersion + " " + .sFile' client/gameversion.json)
          git diff --cached --quiet || (git commit -m "AQW client $VER" && git push)